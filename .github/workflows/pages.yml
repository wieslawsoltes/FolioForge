name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          for source in src/*.js; do node --check "$source"; done
      - name: Run kernel tests
        run: npm test
      - name: Regenerate portable editions
        run: python3 tools/prepare-release.py
      - name: Stage static application
        run: |
          mkdir -p _site
          cp index.html styles.css FolioForge.html LICENSE README.md TESTING.md .nojekyll _site/
          cp -R src assets examples _site/
          python3 - <<'PY'
          import json, pathlib, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          pathlib.Path('_site/build-info.json').write_text(json.dumps({'application': 'FolioForge', 'version': version, 'commit': sha}) + '\n')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
