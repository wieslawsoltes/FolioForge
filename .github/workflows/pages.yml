name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          for source in src/*.js; do node --check "$source"; done
      - name: Run kernel tests
        run: npm test
      - name: Regenerate portable editions
        run: python3 tools/prepare-release.py
      - name: Stage static application
        run: |
          mkdir -p _site
          cp index.html styles.css FolioForge.html LICENSE README.md TESTING.md .nojekyll _site/
          cp -R src assets examples _site/
          python3 - <<'PY'
          import json, pathlib, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          pathlib.Path('_site/build-info.json').write_text(json.dumps({'application': 'FolioForge', 'version': version, 'commit': sha}) + '\n')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published application
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          expected = os.environ['EXPECTED_COMMIT']
          def read(path):
              request = Request(base + path + '?verify=' + expected, headers={'Cache-Control': 'no-cache', 'User-Agent': 'FolioForge-Pages-Verification'})
              with urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path}: HTTP {response.status}')
                  return response.read()
          for attempt in range(30):
              try:
                  info = json.loads(read('build-info.json'))
                  if info.get('commit') != expected or info.get('application') != 'FolioForge':
                      raise RuntimeError(f'Unexpected live build: {info}')
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(2)
          html = read('').decode('utf-8')
          if '<title>FolioForge' not in html or './src/app.js' not in html:
              raise RuntimeError('Published index is not the FolioForge application')
          for path in ('styles.css', 'src/app.js', 'src/core.js', 'src/demo.js', 'src/icons.js', 'src/io.js', 'src/renderer.js', 'src/text.js', 'assets/architecture.webp', 'assets/detail.webp', 'FolioForge.html', 'examples/FORM-Architecture.folio'):
              data = read(path)
              if not data:
                  raise RuntimeError(f'Empty published asset: {path}')
              print(f'HTTP 200: {path} ({len(data):,} bytes)')
          print(f'Verified live FolioForge {info["version"]} at {base}; commit {expected}')
          PY
